identity:
  name: rhel-9
  platform: rhel
  version: "9"
  variant: null   # bare metal

tunable_surface:
  # NIC queue expansion via ethtool -L combined N.
  # max_combined=0 means "resolve to logical_cores at catalog build time".
  # Effective ceiling: min(max_combined_resolved, ethtool-l hardware max).
  network_queues:
    min_combined: 1
    max_combined: 0       # 0 = use logical_cores as ceiling
    allow_irq_affinity: true
    priority_tier: high
    apply_mode: reload    # ethtool -L takes effect immediately; no service restart

  # CPU frequency governor via cpupower frequency-set -g.
  cpu_governor:
    allowed_governors: [performance, schedutil, powersave]
    forbidden_governors: []
    preferred_governor: performance
    priority_tier: high
    apply_mode: reload    # sysfs write; takes effect immediately

  # Host-level sysctls beyond service-specific relevant_sysctls.
  # These broaden the kernel tuning surface available to the rhel_expert agent.
  host_sysctls:
    - name: net.core.rmem_max
      priority_tier: medium
      rationale_hint: "System-wide max receive socket buffer; raise for high-BDP flows"
    - name: net.core.wmem_max
      priority_tier: medium
      rationale_hint: "System-wide max send socket buffer; pair with rmem_max"
    - name: net.ipv4.tcp_rmem
      priority_tier: medium
      rationale_hint: "TCP receive buffer auto-tuning range (min default max)"
    - name: net.ipv4.tcp_wmem
      priority_tier: medium
      rationale_hint: "TCP send buffer auto-tuning range (min default max)"
    - name: net.ipv4.tcp_max_syn_backlog
      priority_tier: medium
      rationale_hint: "SYN queue depth; raise alongside somaxconn for burst traffic"
    - name: net.ipv4.tcp_tw_reuse
      priority_tier: low
      rationale_hint: "Allow reuse of TIME_WAIT sockets; reduces ephemeral port exhaustion"
    - name: vm.swappiness
      priority_tier: low
      rationale_hint: "Reduce kernel swap preference to keep latency-sensitive data in RAM"

  # Environment blockers: external constraints that make tuning pointless.
  # Probed during pre-tune diagnostic; fixed if policy allows.
  environment_blockers:
    - name: iptables_connlimit
      probe_command: "iptables -L INPUT -n 2>/dev/null | grep -ciE 'connlimit|#conn' || echo 0"
      threshold_above: 0
      fix_command: >-
        iptables -L INPUT --line-numbers -n 2>/dev/null
        | awk '/connlimit|#conn/ {print $1}'
        | sort -rn
        | xargs -I{} iptables -D INPUT {}
      priority: critical
      detail: "iptables connlimit rule caps concurrent connections; removing only connlimit rules"

    - name: nftables_rate_limit
      probe_command: "nft list ruleset 2>/dev/null | grep -ci 'limit rate' || echo 0"
      threshold_above: 0
      fix_command: >-
        nft -a list ruleset 2>/dev/null
        | awk '/^table / {fam=$2; tbl=$3} /^[[:space:]]*chain / {chn=$2}
        /limit rate.*handle / {match($0, /handle ([0-9]+)/, m); print fam, tbl, chn, m[1]}'
        | while read fam tbl chn h; do
        nft delete rule "$fam" "$tbl" "$chn" handle "$h" 2>/dev/null;
        done; true
      priority: critical
      detail: "nftables rate-limit rules throttle connections; removing only rate-limit rules"

    - name: conntrack_max
      probe_command: "lsmod | grep -q nf_conntrack && sysctl -n net.netfilter.nf_conntrack_max 2>/dev/null || echo skip"
      threshold_below: 262144
      fix_command: "sysctl -w net.netfilter.nf_conntrack_max=1048576"
      priority: high
      detail: "Low conntrack table causes connection drops under load"

    - name: tc_shaping
      probe_command: "tc qdisc show dev {interface} 2>/dev/null | grep -cvE 'noqueue|pfifo_fast|fq_codel|mq' || echo 0"
      threshold_above: 0
      fix_command: "tc qdisc del dev {interface} root 2>/dev/null || true"
      priority: critical
      detail: "Non-default tc qdisc caps bandwidth below NIC capacity"

    - name: io_hog_process
      probe_command: "ps aux --sort=-%cpu | awk 'NR>1 && $3+0>50 && $11 !~ /nginx|sshd|systemd/ {print $2, $11, $3\"%cpu\"}' | head -3"
      threshold_above: null
      fix_command: null
      priority: high
      detail: "Background process consuming excessive CPU/IO; signal only"

    - name: memory_hog_process
      probe_command: "ps aux --sort=-%mem | awk 'NR>1 && $4+0>50 && $11 !~ /nginx|sshd|systemd/ {print $2, $11, $4\"%mem\"}' | head -3"
      threshold_above: null
      fix_command: null
      priority: high
      detail: "Background process consuming >50% memory; signal only"

    - name: systemd_cpu_quota
      probe_command: >-
        val=$(systemctl show nginx.service --property=CPUQuota --value 2>/dev/null);
        case "$val" in infinity|"") echo 0;; *%) echo "${val%%%}";; *) echo 0;; esac
      threshold_above: 0
      fix_command: "systemctl set-property nginx.service CPUQuota="
      priority: critical
      detail: "Systemd CPUQuota caps nginx CPU below 100%; removing quota"

    - name: systemd_memory_max
      probe_command: >-
        val=$(systemctl show nginx.service --property=MemoryMax --value 2>/dev/null);
        case "$val" in infinity|"") echo 0;; *) echo "$val";; esac
      threshold_above: 0
      fix_command: "systemctl set-property nginx.service MemoryMax="
      priority: critical
      detail: "Systemd MemoryMax restricts nginx memory; removing cap"

    - name: systemd_limit_nofile
      probe_command: >-
        val=$(systemctl show nginx.service --property=LimitNOFILE --value 2>/dev/null);
        case "$val" in infinity|"") echo 999999;; *) echo "$val";; esac
      threshold_below: 65536
      fix_command: >-
        systemctl set-property nginx.service LimitNOFILE=524288 &&
        systemctl restart nginx.service
      priority: critical
      detail: "Systemd LimitNOFILE too low; nginx will hit fd exhaustion under load"

    - name: systemd_io_weight
      probe_command: >-
        val=$(systemctl show nginx.service --property=IOWeight --value 2>/dev/null);
        case "$val" in ""|"[not set]") echo 100;; *) echo "$val";; esac
      threshold_below: 50
      fix_command: "systemctl set-property nginx.service IOWeight=100"
      priority: high
      detail: "Systemd IOWeight too low; nginx I/O deprioritized vs other services"

    - name: systemd_cpu_weight
      probe_command: >-
        val=$(systemctl show nginx.service --property=CPUWeight --value 2>/dev/null);
        case "$val" in ""|"[not set]") echo 100;; *) echo "$val";; esac
      threshold_below: 50
      fix_command: "systemctl set-property nginx.service CPUWeight=100"
      priority: high
      detail: "Systemd CPUWeight too low; nginx CPU deprioritized vs other services"

    - name: nginx_not_running
      probe_command: "systemctl is-active nginx.service 2>/dev/null | grep -c '^active$' || echo 0"
      threshold_below: 1
      fix_command: "systemctl restart nginx.service"
      priority: critical
      detail: "nginx.service is not running; restarting before baseline"
