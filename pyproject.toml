[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "preflight"
version = "0.1.0"
description = "Step 1 scaffold for a generic RHEL performance-tuning agent."
requires-python = ">=3.11"
dependencies = [
  "openai>=1.52",
  "PyYAML>=6.0",
  "langgraph>=0.2.39",
]

[project.optional-dependencies]
dev = [
  "coverage[toml]>=7.6",
  "mypy>=1.11",
  "pre-commit>=3.8",
  "pytest>=8.3",
  "ruff>=0.6",
]

[project.scripts]
preflight = "main:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ANN", "ASYNC", "S", "SIM"]
ignore = ["ANN101", "S603"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
pretty = true
show_error_codes = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=src/preflight --cov=src/onboard --cov=src/snapshot --cov=src/baseline --cov=src/tune --cov=src/host_profile --cov=main --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
branch = true
source = ["src/preflight", "src/onboard", "src/snapshot", "src/baseline", "src/tune", "src/host_profile", "main"]

[tool.coverage.report]
skip_empty = true
show_missing = true
