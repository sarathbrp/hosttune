hardware_topology:
  - id: prefer_performance_governor_high_core
    enabled: true
    action: recommend
    kind: host_profile_preferred_governor
    candidate_key: platform.cpu_governor.scaling_governor
    min_logical_cores: 32
    min_numa_nodes: 1

  - id: signal_dual_numa_high_core_host
    enabled: true
    action: signal
    kind: host_fact_signal
    signal_key: numa_topology
    detail: "Dual-NUMA high-core host detected; consider affinity-aware tuning and per-node scaling."
    min_logical_cores: 64
    min_numa_nodes: 2

kernel_os_baseline:
  - id: widen_nic_queues_high_core
    enabled: true
    action: recommend
    kind: queue_scale_up
    candidate_key: network.queue.combined
    min_logical_cores: 32

  - id: recommend_somaxconn_high_core
    enabled: true
    action: recommend
    kind: candidate_floor
    candidate_key: sysctl.net.core.somaxconn
    min_logical_cores: 32
    floor_value: 8192

  - id: recommend_netdev_backlog_high_core
    enabled: true
    action: recommend
    kind: candidate_floor
    candidate_key: sysctl.net.core.netdev_max_backlog
    min_logical_cores: 32
    floor_value: 5000

  - id: recommend_tcp_max_syn_backlog_high_core
    enabled: true
    action: recommend
    kind: candidate_floor
    candidate_key: sysctl.net.ipv4.tcp_max_syn_backlog
    min_logical_cores: 32
    floor_value: 8192

  - id: recommend_rmem_max_high_core
    enabled: true
    action: recommend
    kind: candidate_floor
    candidate_key: sysctl.net.core.rmem_max
    min_logical_cores: 32
    floor_value: 16777216

  - id: recommend_wmem_max_high_core
    enabled: true
    action: recommend
    kind: candidate_floor
    candidate_key: sysctl.net.core.wmem_max
    min_logical_cores: 32
    floor_value: 16777216

  - id: recommend_swappiness_low_memory_pressure
    enabled: true
    action: recommend
    kind: candidate_ceiling
    candidate_key: sysctl.vm.swappiness
    min_ram_gb: 64
    ceiling_value: 10

  - id: signal_irqbalance_state
    enabled: true
    action: signal
    kind: host_fact_signal
    signal_key: irqbalance
    detail: "Review irqbalance and NIC IRQ distribution before deep network tuning."

  - id: signal_hugepages_relevance_large_memory
    enabled: true
    action: signal
    kind: host_fact_signal
    signal_key: hugepages
    detail: "Large-memory host detected; hugepages may matter if workload becomes memory or TLB sensitive."
    min_ram_gb: 256

application_discovery_sanity:
  - id: nginx_disable_access_log
    enabled: true
    action: autofix
    kind: service_current_not
    service_name: nginx
    candidate_key: service.directive.access_log
    proposed_value: "off"
    interference_source_contains: "access logging"
    only_when_current_in:
      - "/var/log/nginx/access.log"
      - "/var/log/nginx/access.log main"

  - id: nginx_enable_sendfile
    enabled: true
    action: autofix
    kind: service_current_not
    service_name: nginx
    candidate_key: service.directive.sendfile
    proposed_value: "on"
    only_when_current_in:
      - "off"

  - id: nginx_align_worker_rlimit_nofile
    enabled: true
    action: recommend
    kind: align_worker_rlimit_to_unit_limit
    service_name: nginx
    candidate_key: service.directive.worker_rlimit_nofile

  - id: nginx_worker_processes_scale_check
    enabled: true
    action: signal
    kind: candidate_scale_outlier
    service_name: nginx
    candidate_key: service.directive.worker_processes
    min_logical_cores: 32
    min_recommended_value: 32
    preferred_value: "auto or scale-aware worker count"
    detail: "nginx worker_processes appears undersized for a high-core host; prefer auto or a scale-aware worker count."

  - id: nginx_worker_connections_floor
    enabled: true
    action: recommend
    kind: candidate_floor
    service_name: nginx
    candidate_key: service.directive.worker_connections
    min_logical_cores: 32
    floor_value: 65535

  - id: nginx_keepalive_requests_floor
    enabled: true
    action: recommend
    kind: candidate_floor
    service_name: nginx
    candidate_key: service.directive.keepalive_requests
    min_logical_cores: 32
    floor_value: 10000

  - id: nginx_keepalive_timeout_floor
    enabled: true
    action: recommend
    kind: candidate_floor
    service_name: nginx
    candidate_key: service.directive.keepalive_timeout
    min_logical_cores: 32
    floor_value: 30

  - id: nginx_enable_tcp_nopush
    enabled: true
    action: autofix
    kind: service_current_not
    service_name: nginx
    candidate_key: service.directive.tcp_nopush
    proposed_value: "on"
    only_when_current_in:
      - "off"

  - id: nginx_enable_tcp_nodelay
    enabled: true
    action: autofix
    kind: service_current_not
    service_name: nginx
    candidate_key: service.directive.tcp_nodelay
    proposed_value: "on"
    only_when_current_in:
      - "off"

  - id: nginx_disable_gzip
    enabled: true
    action: autofix
    kind: service_current_not
    service_name: nginx
    candidate_key: service.directive.gzip
    proposed_value: "off"
    only_when_current_in:
      - "on"
    detail: >-
      gzip adds CPU overhead per response. On fast local networks the
      bandwidth saving is negligible; disabling improves RPS.

  - id: nginx_recommend_open_file_cache_hotset
    enabled: true
    action: recommend
    kind: service_current_not
    service_name: nginx
    candidate_key: service.directive.open_file_cache
    proposed_value: "max=200000 inactive=20s"
    only_when_current_in:
      - "off"
      - "on"
      - "true"
      - "enable"

  - id: nginx_recommend_open_file_cache_balanced
    enabled: true
    action: recommend
    kind: service_current_not
    service_name: nginx
    candidate_key: service.directive.open_file_cache
    proposed_value: "max=100000 inactive=60s"
    only_when_current_in:
      - "off"
      - "on"
      - "true"
      - "enable"

  - id: signal_nginx_cpu_affinity_on_dual_numa
    enabled: true
    action: signal
    kind: host_fact_signal
    service_name: nginx
    signal_key: worker_cpu_affinity
    detail: "Dual-NUMA nginx host detected; worker CPU affinity may improve locality."
    min_logical_cores: 64
    min_numa_nodes: 2

  - id: nginx_disable_limit_rate
    enabled: true
    action: autofix
    kind: service_current_not
    service_name: nginx
    candidate_key: service.directive.limit_rate
    proposed_value: "0"
    detail: >-
      limit_rate is a per-connection bandwidth cap (e.g. 5m = 5 MB/s per client).
      Any non-zero value is a hard external throttle that masks tuning gains.
      Set to 0 to remove the cap during performance benchmarking.

  - id: signal_nginx_reuseport_consideration
    enabled: true
    action: signal
    kind: host_fact_signal
    service_name: nginx
    signal_key: reuseport
    detail: "Consider listen reuseport on high-core systems if accept distribution becomes a bottleneck."
    min_logical_cores: 32

  - id: signal_nginx_multi_accept_consideration
    enabled: true
    action: recommend
    kind: service_current_not
    service_name: nginx
    candidate_key: service.directive.multi_accept
    proposed_value: "on"
    only_when_current_in:
      - "off"
    min_logical_cores: 32

environment_blockers:
  - id: detect_conntrack_pressure
    enabled: true
    action: signal
    kind: environment_blocker
    signal_key: conntrack_pressure
    probe_command: "sysctl -n net.netfilter.nf_conntrack_count net.netfilter.nf_conntrack_max 2>/dev/null"
    threshold_ratio: 0.8
    detail: "Conntrack table is above 80% capacity; external connection tracking may throttle new connections before tuning can help. Consider raising nf_conntrack_max or reviewing firewall rules."

  - id: detect_iptables_connection_limit
    enabled: true
    action: signal
    kind: environment_blocker
    signal_key: firewall_connlimit
    probe_command: "iptables -L -n 2>/dev/null | grep -ci connlimit || echo 0"
    threshold_count: 1
    detail: "iptables connlimit rules detected; firewall may be rate-limiting connections independently of service tuning."

  - id: detect_tc_shaping
    enabled: true
    action: signal
    kind: environment_blocker
    signal_key: tc_shaping
    probe_command: "tc qdisc show 2>/dev/null | grep -cv 'noqueue\\|pfifo_fast\\|fq_codel\\|mq' || echo 0"
    threshold_count: 1
    detail: "Non-default tc qdisc detected; traffic shaping may impose bandwidth or latency limits that mask tuning gains."

  - id: detect_cgroup_cpu_throttle
    enabled: true
    action: signal
    kind: environment_blocker
    signal_key: cgroup_cpu_throttle
    probe_command: "cat /sys/fs/cgroup/cpu.stat 2>/dev/null | awk '/nr_throttled/ {print $2}' || echo 0"
    threshold_count: 100
    detail: "Significant cgroup CPU throttling detected (nr_throttled > 100); the service may be hitting a hard CPU quota before tuning gains are visible."

postcheck_escalation:
  - id: fallback_to_llm
    enabled: true
    action: signal
    kind: host_fact_signal
    only_if_no_action: true
    signal_key: escalation
    detail: "No deterministic quick fix matched; escalate to the single hybrid LLM pass."
