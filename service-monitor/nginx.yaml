identity:
  service_name: nginx
  systemd_unit_name: nginx.service
  rhel_versions:
    - "9"
  service_versions: []
  config_paths:
    - /etc/nginx/nginx.conf
    - /etc/nginx/conf.d
  config_format: nginx
  working_directory: /var/www/nginx
  log_paths:
    - /var/log/nginx/access.log
    - /var/log/nginx/error.log

health_check:
  probe_type: http
  target: http://127.0.0.1/
  expected_status_code: 200
  expected_string: null
  expected_exit_code: null
  timeout_seconds: 5
  retries: 3
  warmup_seconds: 2

snapshot:
  files_to_snapshot:
    - /etc/nginx/nginx.conf
    - /etc/nginx/conf.d
  runtime_state_command: nginx -T
  process_state:
    pid_file: /run/nginx.pid
    worker_process_hint: nginx
    open_connections_command: ss -tan '( sport = :80 )'
  restore_sequence:
    - cp -a {{ snapshot_dir }}/nginx.conf /etc/nginx/nginx.conf
    - cp -a {{ snapshot_dir }}/conf.d /etc/nginx/conf.d
    - systemctl restart nginx
  snapshot_storage_location: /var/tmp/hosttune/snapshots/nginx

restart:
  reload:
    supported: true
    command: systemctl reload nginx
  restart:
    supported: true
    command: systemctl restart nginx
    expected_downtime_seconds: 5
  # kernel_network: use reload for tunable_surface relevant_sysctls (live sysctl writes).
  # reboot here omits every sysctl from the candidate catalog; reserve reboot for knobs that truly need it.
  change_categories:
    service_config: reload
    worker_model: restart
    kernel_network: reload
    runtime_limits: reload
    # systemd unit Limit* via set-property; typically needs restart to affect service cgroup.
    systemd_unit_limits: restart
    # systemd cgroup resource controls (CPUQuota, MemoryMax); require cgroup v2 and restart.
    cgroup_resource_controls: restart
  drain_policy: best_effort
  dependency_chain: []
  post_restart_validation: health_check

tunable_surface:
  allowed_directives:
    access_log:
      value_type: enum
      priority_tier: high
      allowed_values:
        - "off"
        - "/var/log/nginx/access.log"
        - "/var/log/nginx/access.log main"
      apply_mode: reload
      forbidden_values: []
    keepalive_requests:
      value_type: integer
      priority_tier: high
      min_value: 100
      max_value: 100000
      apply_mode: reload
      forbidden_values: []
    worker_processes:
      value_type: integer
      priority_tier: high
      min_value: 1
      max_value: 112
      apply_mode: reload
      forbidden_values:
        - "1"
    worker_connections:
      value_type: integer
      priority_tier: high
      min_value: 128
      max_value: 65535
      apply_mode: reload
      forbidden_values:
        - "128"
    worker_rlimit_nofile:
      value_type: integer
      priority_tier: high
      min_value: 1024
      max_value: 1048576
      apply_mode: reload
      forbidden_values: []
    keepalive_timeout:
      value_type: integer
      priority_tier: low
      min_value: 1
      max_value: 300
      apply_mode: reload
      forbidden_values: []
    sendfile:
      value_type: enum
      priority_tier: medium
      allowed_values:
        - "on"
        - "off"
      apply_mode: reload
      forbidden_values:
        - "off"
  forbidden_directives:
    - master_process
    - daemon
  interdependencies:
    - worker_processes -> verify CPU topology and NUMA layout
    - worker_connections -> verify file descriptor limits
  relevant_sysctls:
    - name: net.core.somaxconn
      priority_tier: high
    - name: net.core.netdev_max_backlog
      priority_tier: high
    - name: net.ipv4.ip_local_port_range
      priority_tier: medium
  network_ring_priority_tier: medium
  runtime_limits:
    nofile_soft:
      value_type: integer
      priority_tier: high
      min_value: 1024
      max_value: 2097152
      apply_mode: reload
      allowed_values: []
      forbidden_values: []
  # systemd unit Limit* via set-property. YAML keys: limit_nofile -> LimitNOFILE,
  # limit_nproc -> LimitNPROC. Complements runtime_limits (prlimit on PID) for unit-wide limits.
  systemd_unit_limits:
    limit_nofile:
      value_type: integer
      priority_tier: high
      min_value: 65535
      max_value: 2097152
      apply_mode: restart
      allowed_values: []
      forbidden_values: []
    limit_nproc:
      value_type: integer
      priority_tier: medium
      min_value: 64
      max_value: 655350
      apply_mode: restart
      allowed_values: []
      forbidden_values: []
  # systemd cgroup resource controls (systemctl set-property). Requires cgroup v2.
  # cpu_quota_percent -> CPUQuota=N%, memory_max_mib -> MemoryMax=NM.
  # No applier implemented yet; YAML declares the contract surface for future use.
  cgroup_resource_controls:
    cpu_quota_percent:
      value_type: integer
      priority_tier: medium
      min_value: 10
      max_value: 400
      apply_mode: restart
      allowed_values: []
      forbidden_values: []
    memory_max_mib:
      value_type: integer
      priority_tier: low
      min_value: 64
      max_value: 65536
      apply_mode: restart
      allowed_values: []
      forbidden_values: []

benchmark_hints:
  primary_metric: requests_per_second
  guardrail_metrics:
    - p95_latency
    - error_rate
  expected_variance: 0.05
  warmup_seconds: 10
  interference_sources:
    - access logging to the benchmarked disk
    - external TLS termination
