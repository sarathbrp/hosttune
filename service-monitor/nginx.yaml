identity:
  service_name: nginx
  systemd_unit_name: nginx.service
  rhel_versions:
    - "9"
  service_versions: []
  config_paths:
    - /etc/nginx/nginx.conf
    - /etc/nginx/conf.d
  config_format: nginx
  working_directory: /var/www/nginx
  log_paths:
    - /var/log/nginx/access.log
    - /var/log/nginx/error.log

health_check:
  probe_type: http
  target: http://127.0.0.1/
  expected_status_code: 200
  expected_string: null
  expected_exit_code: null
  timeout_seconds: 5
  retries: 3
  warmup_seconds: 2

snapshot:
  files_to_snapshot:
    - /etc/nginx/nginx.conf
    - /etc/nginx/conf.d
  runtime_state_command: nginx -T
  process_state:
    pid_file: /run/nginx.pid
    worker_process_hint: nginx
    open_connections_command: ss -tan '( sport = :80 )'
  restore_sequence:
    - cp -a {{ snapshot_dir }}/nginx.conf /etc/nginx/nginx.conf
    - cp -a {{ snapshot_dir }}/conf.d /etc/nginx/conf.d
    - systemctl restart nginx
  snapshot_storage_location: /var/tmp/hosttune/snapshots/nginx

restart:
  reload:
    supported: true
    command: systemctl reload nginx
  restart:
    supported: true
    command: systemctl restart nginx
    expected_downtime_seconds: 5
  # kernel_network: use reload for tunable_surface relevant_sysctls (live sysctl writes).
  # reboot here omits every sysctl from the candidate catalog; reserve reboot for knobs that truly need it.
  change_categories:
    service_config: reload
    worker_model: restart
    kernel_network: reload
    runtime_limits: reload
    # systemd unit Limit* via set-property; typically needs restart to affect service cgroup.
    systemd_unit_limits: restart
    # systemd cgroup resource controls (CPUQuota, MemoryMax); require cgroup v2 and restart.
    cgroup_resource_controls: restart
  drain_policy: best_effort
  dependency_chain: []
  post_restart_validation: health_check

tunable_surface:
  allowed_directives:
    access_log:
      value_type: enum
      priority_tier: high
      allowed_values:
        - "off"
        - "/var/log/nginx/access.log"
        - "/var/log/nginx/access.log main"
      apply_mode: reload
      forbidden_values: []
    keepalive_requests:
      value_type: integer
      priority_tier: high
      min_value: 100
      max_value: 100000
      apply_mode: reload
      forbidden_values: []
    open_file_cache:
      value_type: string
      priority_tier: medium
      apply_mode: reload
      forbidden_values:
        - "off"
        - "on"           # INVALID nginx syntax
        - "true"         # INVALID
        - "enable"       # INVALID
      rationale_hint: >-
        ONLY valid syntax: 'max=N inactive=Xs' where N is entry count and X is TTL seconds.
        Example: 'max=200000 inactive=20s' — this is the ONLY accepted format.
        'on', 'true', 'enable', 'off' are all rejected. The resolver auto-applies the correct value.
    gzip:
      value_type: enum
      priority_tier: medium
      allowed_values:
        - "on"
        - "off"
      apply_mode: reload
      forbidden_values: []
    tcp_nopush:
      value_type: enum
      priority_tier: medium
      allowed_values:
        - "on"
        - "off"
      apply_mode: reload
      forbidden_values: []
    tcp_nodelay:
      value_type: enum
      priority_tier: medium
      allowed_values:
        - "on"
        - "off"
      apply_mode: reload
      forbidden_values: []
    limit_rate:
      value_type: string
      priority_tier: high
      apply_mode: reload
      forbidden_values: []
      rationale_hint: >-
        Per-connection bandwidth throttle. Any non-zero value (e.g. 5m = 5 MB/s cap)
        directly limits throughput per client. Set to 0 to disable the cap for
        benchmarking. This is a hard external throttle, not a tuning knob.
    aio:
      value_type: enum
      priority_tier: low
      allowed_values:
        - "on"
        - "off"
        - "threads"
      apply_mode: reload
      forbidden_values:
        - "off"
    worker_processes:
      value_type: integer
      priority_tier: high
      min_value: 1
      max_value: 112
      apply_mode: reload
      forbidden_values:
        - "1"
    worker_connections:
      value_type: integer
      priority_tier: high
      min_value: 128
      max_value: 65535
      apply_mode: reload
      forbidden_values:
        - "128"
    worker_rlimit_nofile:
      value_type: integer
      priority_tier: high
      min_value: 65535       # must be >= worker_connections; <65535 caps connections
      max_value: 2097152     # kernel max fd limit
      apply_mode: reload
      forbidden_values: []
    keepalive_timeout:
      value_type: integer
      priority_tier: low
      min_value: 15          # <15s is too aggressive for static-asset connection reuse
      max_value: 120         # >120s accumulates idle connections, wastes memory
      apply_mode: reload
      forbidden_values: []
    multi_accept:
      value_type: enum
      priority_tier: medium
      allowed_values:
        - "on"
        - "off"
      apply_mode: reload
      forbidden_values: []
    worker_cpu_affinity:
      value_type: string
      priority_tier: medium
      apply_mode: reload
      forbidden_values: []
    sendfile:
      value_type: enum
      priority_tier: medium
      allowed_values:
        - "on"
        - "off"
      apply_mode: reload
      forbidden_values:
        - "off"
  forbidden_directives:
    - master_process
    - daemon
  parameter_groups:
    - name: nginx_static_io_trio
      members:
        - parameter_key: service.directive.sendfile
          target_value: "on"
        - parameter_key: service.directive.tcp_nopush
          target_value: "on"
        - parameter_key: service.directive.tcp_nodelay
          target_value: "on"
  performance_hierarchy:
    version: "1.1"
    description: "NGINX Parameter Hierarchy with RHEL 9.7 Inspection Commands"
    groups:
      1_cpu_parallelism:
        description: "The Engine: Mapping NGINX to Physical Hardware"
        parameters:
          worker_processes:
            target_perf: "auto (or 112)"
            inspect_cmd: "nginx -T | grep -E '^worker_processes'"
            detail: "Current count of active workers in the process tree."
            candidate_key: "service.directive.worker_processes"
            target_type: "range"
            target_value: "56-112"
            enforceable: true
          worker_cpu_affinity:
            target_perf: "auto"
            inspect_cmd: "ps -mo pid,tid,psr,comm -p $(pgrep -n nginx)"
            detail: "Shows which logical CPU (PSR column) each worker thread is currently pinned to."
            candidate_key: "service.directive.worker_cpu_affinity"
            enforceable: false
          accept_mutex:
            target_perf: "off"
            inspect_cmd: "nginx -T | grep 'accept_mutex'"
            detail: "Verifies if workers are competing for connections without serialization."
            enforceable: false

      2_concurrency_ingress:
        description: "The Gates: Total Volume of Simultaneous Traffic"
        depends_on_groups:
          - "1_cpu_parallelism"
        parameters:
          worker_rlimit_nofile:
            target_perf: "200000+"
            inspect_cmd: "cat /proc/$(pgrep -n nginx)/limits | grep 'Max open files'"
            detail: "Verifies the effective hard/soft file descriptor limits for the master process."
            candidate_key: "service.directive.worker_rlimit_nofile"
            target_type: "min"
            target_value: "200000"
            enforceable: true
          worker_connections:
            target_perf: "65535"
            inspect_cmd: "nginx -T | grep 'worker_connections'"
            detail: "Max connections allowed per worker process."
            candidate_key: "service.directive.worker_connections"
            target_type: "exact"
            target_value: "65535"
            enforceable: true
          listen_backlog:
            target_perf: "65535"
            inspect_cmd: "ss -plnt sport eq :80"
            detail: "The 'Send-Q' column shows the current kernel listener backlog depth for port 80."
            candidate_key: "sysctl.net.core.somaxconn"
            target_type: "exact"
            target_value: "65535"
            enforceable: true
          multi_accept:
            target_perf: "on"
            inspect_cmd: "nginx -T | grep 'multi_accept'"
            detail: "Verifies if workers accept all new connections in a single cycle."
            candidate_key: "service.directive.multi_accept"
            target_type: "exact"
            target_value: "on"
            enforceable: true

      3_io_fast_path:
        description: "The Express Lane: Data Movement Efficiency"
        depends_on_groups:
          - "2_concurrency_ingress"
        parameters:
          sendfile:
            target_perf: "on"
            inspect_cmd: "nginx -T | grep 'sendfile '"
            detail: "Ensures the zero-copy kernel-to-NIC path is active."
            candidate_key: "service.directive.sendfile"
            target_type: "exact"
            target_value: "on"
            enforceable: true
          tcp_nopush:
            target_perf: "on"
            inspect_cmd: "nginx -T | grep 'tcp_nopush'"
            detail: "Confirms packet header packing is enabled."
            candidate_key: "service.directive.tcp_nopush"
            target_type: "exact"
            target_value: "on"
            enforceable: true
          tcp_nodelay:
            target_perf: "on"
            inspect_cmd: "nginx -T | grep 'tcp_nodelay'"
            detail: "Verifies the disabling of Nagle's algorithm for small-packet latency."
            candidate_key: "service.directive.tcp_nodelay"
            target_type: "exact"
            target_value: "on"
            enforceable: true
          aio:
            target_perf: "threads"
            inspect_cmd: "nginx -T | grep 'aio '"
            detail: "Confirms if NGINX is using the thread pool for non-blocking I/O."
            candidate_key: "service.directive.aio"
            target_type: "exact"
            target_value: "threads"
            enforceable: true
          directio:
            target_perf: "512"
            inspect_cmd: "nginx -T | grep 'directio '"
            detail: "Checks for page cache bypass on large files."
            enforceable: false
          open_file_cache:
            target_perf: "max=200000"
            inspect_cmd: "nginx -T | grep 'open_file_cache '"
            detail: "Displays entries and TTL for the metadata cache."
            candidate_key: "service.directive.open_file_cache"
            target_type: "string_prefix"
            target_value: "max=200000"
            enforceable: true

      4_protocol_payload:
        description: "The Efficiency: Reducing Per-Request Overhead"
        depends_on_groups:
          - "1_cpu_parallelism"
          - "2_concurrency_ingress"
          - "3_io_fast_path"
        parameters:
          keepalive_timeout:
            target_perf: "30-65"
            inspect_cmd: "nginx -T | grep 'keepalive_timeout'"
            detail: "Idle connection timeout value."
            candidate_key: "service.directive.keepalive_timeout"
            target_type: "range"
            target_value: "30-65"
            enforceable: true
          keepalive_requests:
            target_perf: "10000"
            inspect_cmd: "nginx -T | grep 'keepalive_requests'"
            detail: "Max requests allowed per persistent connection."
            candidate_key: "service.directive.keepalive_requests"
            target_type: "exact"
            target_value: "10000"
            enforceable: true
          client_body_buffer_size:
            target_perf: "128k"
            inspect_cmd: "nginx -T | grep 'client_body_buffer_size'"
            detail: "RAM allocated for request body processing."
            enforceable: false
          access_log:
            target_perf: "off"
            inspect_cmd: "nginx -T | grep 'access_log'"
            detail: "Checks if the 'log tax' is disabled for benchmarking."
            candidate_key: "service.directive.access_log"
            target_type: "exact"
            target_value: "off"
            enforceable: true
          error_log_level:
            target_perf: "warn"
            inspect_cmd: "nginx -T | grep 'error_log'"
            detail: "Displays logging verbosity."
            enforceable: false

      5_throttling_governors:
        description: "The Brakes: Security and Resource Constraints"
        depends_on_groups:
          - "4_protocol_payload"
        parameters:
          gzip:
            target_perf: "off"
            inspect_cmd: "nginx -T | grep -E '^gzip '"
            detail: "Ensures CPU-intensive compression is disabled."
            candidate_key: "service.directive.gzip"
            target_type: "exact"
            target_value: "off"
            enforceable: true
          limit_rate:
            target_perf: "0"
            inspect_cmd: "nginx -T | grep 'limit_rate'"
            detail: "Checks for bandwidth throttling caps (0 = disabled)."
            candidate_key: "service.directive.limit_rate"
            target_type: "exact"
            target_value: "0"
            enforceable: true
          limit_req:
            target_perf: "off"
            inspect_cmd: "nginx -T | grep 'limit_req'"
            detail: "Checks for request rate-limiting zones."
            enforceable: false
  interdependencies:
    - worker_processes -> verify CPU topology and NUMA layout
    - worker_connections -> verify file descriptor limits
  relevant_sysctls:
    - name: net.core.somaxconn
      priority_tier: high
    - name: net.core.netdev_max_backlog
      priority_tier: high
    - name: net.ipv4.ip_local_port_range
      priority_tier: medium
    - name: net.ipv4.tcp_tw_reuse
      priority_tier: low
      rationale_hint: "0=safe(default); 1=breaks NAT; 2=RFC6191. Keep 0 for inbound-only nginx."
    - name: net.ipv4.tcp_rmem
      priority_tier: medium
      rationale_hint: "Format: 'min default max' bytes. Unlocks auto-tuning to match rmem_max. Recommended: 4096 87380 16777216"
    - name: net.ipv4.tcp_wmem
      priority_tier: medium
      rationale_hint: "Send-side mirror of tcp_rmem. Recommended: 4096 87380 16777216"
  network_ring_priority_tier: medium
  runtime_limits:
    nofile_soft:
      value_type: integer
      priority_tier: high
      min_value: 65535       # <65535 caps concurrent connections
      max_value: 2097152     # kernel max fd limit
      apply_mode: reload
      allowed_values: []
      forbidden_values: []
  # systemd unit Limit* via set-property. YAML keys: limit_nofile -> LimitNOFILE,
  # limit_nproc -> LimitNPROC. Complements runtime_limits (prlimit on PID) for unit-wide limits.
  systemd_unit_limits:
    limit_nofile:
      value_type: integer
      priority_tier: high
      min_value: 65535
      max_value: 2097152
      apply_mode: restart
      allowed_values: []
      forbidden_values: []
    limit_nproc:
      value_type: integer
      priority_tier: medium
      min_value: 2048        # <2048 causes fork failures under load (64 is dangerously low)
      max_value: 655350
      apply_mode: restart
      allowed_values: []
      forbidden_values: []
  # systemd cgroup resource controls (systemctl set-property). Requires cgroup v2.
  # cpu_quota_percent -> CPUQuota=N%, memory_max_mib -> MemoryMax=NM.
  cgroup_resource_controls:
    cpu_quota_percent:
      value_type: integer
      priority_tier: medium
      min_value: 10
      max_value: 400
      apply_mode: restart
      allowed_values: []
      forbidden_values: []
    memory_max_mib:
      value_type: integer
      priority_tier: low
      min_value: 512         # <512MiB will OOM-kill nginx under any real load
      max_value: 65536       # 64GiB cap; leave headroom for kernel + OS
      apply_mode: restart
      allowed_values: []
      forbidden_values: []

benchmark_hints:
  primary_metric: requests_per_second
  guardrail_metrics:
    - p95_latency
    - error_rate
  expected_variance: 0.05
  warmup_seconds: 10
  interference_sources:
    - access logging to the benchmarked disk
    - external TLS termination
