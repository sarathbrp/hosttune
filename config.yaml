target:
  mode: ssh
  host: 172.21.90.178
  user: root
  private_key_path: /root/.ssh/id_rsa
  port: 22
  connect_timeout_seconds: 5

service:
  name: nginx

host_profile:
  name: rhel-9

policy:
  allow_reload: true
  allow_restart: true
  allow_reboot: false
  allow_environment_cleanup: true
  rollback_required: true
  max_iterations: 6
  benchmark_stability_threshold: 0.05

tune:
  prompt_compression: true
  kb_batch_apply: true
  skip_marginal_attribution: true
  marginal_attribution_multiplier: 1.0
  use_unified_resolver: true
  dependency_graph_path: tuning-dependency-graph.yaml
  dspy_compiled_path: artifacts/dspy_compiled.json

mlflow:
  enabled: false
  tracking_uri: http://localhost:5000
  experiment_name: hosttune

benchmark:
  runner:
    mode: local
  contestant_name: hosttune
  script_path: /root/hackathon-tools/benchmark.sh
  compare_script_path: /root/hackathon-tools/compare-results.sh
  results_directory: /root/hackathon-results
  cooling_period_seconds: 30
  workloads:
    - homepage
    - small
    - medium
    - large
    - mixed

